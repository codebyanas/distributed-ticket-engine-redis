name: CI & Test Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: ticket-engine-redis-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ticket-engine-redis-db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Push Database Schema
        run: pnpm exec prisma db push
        env:
          DATABASE_URL: "postgresql://postgres:postgres123@localhost:5432/ticket-engine-redis-db"

      - name: Build and Type Check
        run: pnpm build
        env:
          NODE_ENV: test
          PORT: 5000
          DATABASE_URL: "postgresql://postgres:postgres123@localhost:5432/ticket-engine-redis-db"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-test-jwt-secret-minimum"

      - name: Run Jest Tests with Coverage
        run: pnpm test:cov
        env:
          NODE_ENV: test
          PORT: 5000
          DATABASE_URL: "postgresql://postgres:postgres123@localhost:5432/ticket-engine-redis-db"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-test-jwt-secret-minimum"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}